name: Build ImageGuard APK

on:
  push:
    paths:
      - "ImageGuard/**"
      - ".github/workflows/imageguard-apk.yml"
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ImageGuard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a stable signing key so new versions install over old ones.
      # Add repository secrets IG_KEYSTORE_BASE64, IG_KEYSTORE_PASSWORD, IG_KEY_ALIAS, IG_KEY_PASSWORD.
      - name: Load signing key (if configured)
        env:
          IG_KEYSTORE_BASE64: ${{ secrets.IG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$IG_KEYSTORE_BASE64" ]; then
            echo "$IG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "IG_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release signing key from secrets."
          else
            echo "No signing secrets set; APK will be signed with a temporary key."
          fi

      # Adult + ads + malware domains (StevenBlack hosts, MIT licence), bundled fresh into each build.
      - name: Download web blocklist
        run: |
          curl -fsSL --retry 3 -o hosts.txt \
            https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/porn/hosts
          awk '$1=="0.0.0.0" && $2!="0.0.0.0" {print tolower($2)}' hosts.txt | sort -u \
            > app/src/main/assets/blocklist.txt
          rm hosts.txt
          count=$(wc -l < app/src/main/assets/blocklist.txt)
          echo "Blocklist domains: $count"
          [ "$count" -gt 50000 ] || { echo "Blocklist looks wrong"; exit 1; }

      - name: Build APK
        env:
          IG_KEYSTORE_PASSWORD: ${{ secrets.IG_KEYSTORE_PASSWORD }}
          IG_KEY_ALIAS: ${{ secrets.IG_KEY_ALIAS }}
          IG_KEY_PASSWORD: ${{ secrets.IG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "ImageGuard-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ImageGuard-apk
          path: ImageGuard/ImageGuard-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: imageguard-v1.0.${{ github.run_number }}
          name: ImageGuard 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: ImageGuard/ImageGuard-*.apk
          body: |
            Download **ImageGuard-${{ github.run_number }}.apk** below on your phone and open it to install.
            See ImageGuard/README.md for setup steps.
